<style>
/* Layout: app de uma coluna (máx. 560px) com cabeçalho fixo, telas por aba e barra de abas inferior estilo iOS; formulários abrem em folhas de baixo para cima. */
:root{
  --bg:#FBF5F6; --surface:#FFFFFF; --surface-2:#F7ECEE; --ink:#38262C; --muted:#866E74; --line:#EEDCE0;
  --rose:#CA556C; --rose-soft:#DB6F80; --blush:#F8E4E8; --on-rose:#FFFFFF;
  --ok:#2F8058; --ok-bg:#E3F2EA; --conf:#2C7189; --conf-bg:#E1EFF4; --miss:#A86512; --miss-bg:#FAEEDB; --idle:#7D6A70; --idle-bg:#F1E8EA;
  --shadow:0 1px 2px rgba(80,30,45,.06),0 8px 24px rgba(80,30,45,.07);
  --f-display:"Quicksand","Nunito","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1215; --surface:#251A1E; --surface-2:#2F2227; --ink:#F4E7EA; --muted:#B79FA5; --line:#3B2C32;
  --rose:#E8899A; --rose-soft:#DB6F80; --blush:#3A232A; --on-rose:#2A1218;
  --ok:#73C69A; --ok-bg:#1E3329; --conf:#7DBFD6; --conf-bg:#1C2E36; --miss:#E5AE62; --miss-bg:#3A2B17; --idle:#B9A6AB; --idle-bg:#30252A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1215; --surface:#251A1E; --surface-2:#2F2227; --ink:#F4E7EA; --muted:#B79FA5; --line:#3B2C32;
  --rose:#E8899A; --rose-soft:#DB6F80; --blush:#3A232A; --on-rose:#2A1218;
  --ok:#73C69A; --ok-bg:#1E3329; --conf:#7DBFD6; --conf-bg:#1C2E36; --miss:#E5AE62; --miss-bg:#3A2B17; --idle:#B9A6AB; --idle-bg:#30252A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.mark{width:34px;height:30px;color:var(--rose);flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em}
.brand span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-soft);font-weight:600}
.top .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--rose)}
.iconbtn svg{width:20px;height:20px}

h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;margin:14px 0 2px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 .link{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:14px;font-weight:600;color:var(--rose);background:none;border:0;padding:4px 0}
.sub{color:var(--muted);margin:0}

.banner{margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--miss-bg);color:var(--ink);font-size:14px;border:1px solid var(--line)}
.banner b{color:var(--miss)}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi .k-val{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-note{font-size:12px;color:var(--muted)}
.kpi.hero{grid-column:1/-1;background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.kpi.hero .k-label,.kpi.hero .k-note{color:inherit;opacity:.85}

/* Alerts */
.alert{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:8px}
.alert .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--miss)}
.alert .a-body{flex:1;min-width:0}
.alert .a-body b{display:block;font-weight:600}
.alert .a-body span{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);flex:none}

/* Appointment rows */
.list{display:flex;flex-direction:column;gap:8px}
.appt{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.appt .time{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.appt .who{min-width:0}
.appt .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .who span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.s-realizado{opacity:.78}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill.agendado{background:var(--idle-bg);color:var(--idle)}
.pill.confirmado{background:var(--conf-bg);color:var(--conf)}
.pill.realizado{background:var(--ok-bg);color:var(--ok)}
.pill.faltou{background:var(--miss-bg);color:var(--miss)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rose);}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px 16px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}

/* Segmented + date nav */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .lbl{font-weight:600;min-width:0;text-align:center}
.small-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

.daygroup{margin-top:18px}
.daygroup .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.daygroup .dh b{font-family:var(--f-display);font-weight:700;font-size:16px}
.daygroup .dh span{font-size:13px;color:var(--muted)}
.daygroup.today .dh b{color:var(--rose)}

/* Patients */
.search{width:100%;margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.prow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blush);color:var(--rose);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.prow .p-body{flex:1;min-width:0}
.prow .p-body b{display:block;font-weight:600}
.prow .p-body span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Spine dots — sessões do pacote, inspiradas na coluna do logo */
.spine{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.spine i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--rose-soft);display:block}
.spine i.used{background:var(--rose);border-color:var(--rose)}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%;text-align:left}
.pack .ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pack .ph b{font-weight:600}
.pack .count{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pack .count small{font-size:13px;color:var(--muted);font-weight:600}
.pack .meta{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.pack.done{opacity:.6}

/* Finance */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.lrow:first-child{border-top:0}
.lrow b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.lrow .amt.in{color:var(--ok)}
.lrow .amt.out{color:var(--ink)}
.lrow .lmeta{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.lrow.pend .amt{color:var(--miss)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px}
.chart svg{width:100%;height:auto;display:block}
.chart .c-cap{font-size:12px;color:var(--muted);padding:0 2px 6px;display:flex;justify-content:space-between}

/* Evolutions */
.evo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.evo .eh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.evo .eh b{font-weight:600}
.eva{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.eva i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-style:normal;font-size:13px;font-variant-numeric:tabular-nums}
.evo p{margin:6px 0 0;font-size:14px}
.evo p em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:block}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--rose)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;width:56px;height:56px;border-radius:50%;border:0;background:var(--rose);color:var(--on-rose);box-shadow:0 6px 20px rgba(202,85,108,.4);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:600px){.fab{right:calc(50% - 280px + 16px)}}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(40,15,22,.38);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet header h3{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;min-width:0}
.sheet .body{overflow:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.evascale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.evascale button{aspect-ratio:1;max-width:100%;border-radius:10px;border:2px solid transparent;color:#fff;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.evascale button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.evalegend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:var(--rose);color:var(--on-rose)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--miss);border:1px solid var(--line)}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.statusbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.statusbtns button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700}
.statusbtns button[aria-pressed="true"].agendado{background:var(--idle-bg);color:var(--idle);border-color:var(--idle)}
.statusbtns button[aria-pressed="true"].confirmado{background:var(--conf-bg);color:var(--conf);border-color:var(--conf)}
.statusbtns button[aria-pressed="true"].realizado{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.statusbtns button[aria-pressed="true"].faltou{background:var(--miss-bg);color:var(--miss);border-color:var(--miss)}
.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.info .ir{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.info .ir:first-child{border-top:0}
.info .ir span{color:var(--muted);font-size:13px;flex:none}
.info .ir b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions a,.actions button{flex:1;min-width:120px;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:600;color:var(--rose);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-top:16px}
.welcome p{margin:0 0 14px;color:var(--muted)}
.footer{margin-top:32px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>

(function(){
"use strict";
const COLS=["pacientes","agenda","evolucoes","pacotes","financeiro"];
const S={pacientes:[],agenda:[],evolucoes:[],pacotes:[],financeiro:[],config:{},loaded:{},mode:"loading"};
let db=null;
const UI={tab:"hoje",agMode:"dia",agDate:null,finMonth:null,q:""};
const STATUS={agendado:"Agendado",confirmado:"Confirmado",realizado:"Realizado",faltou:"Faltou"};
const RECURSOS=["Terapia manual","Osteopatia","Dry needling","Ventosa","Kinesio tape","Liberação miofascial","Exercícios terapêuticos","Alongamento","Eletroterapia","Orientações domiciliares"];
const FORMAS=["Pix","Crédito","Débito","Dinheiro"];
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DSEM=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DSEM_L=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=s=>{const d=parseYmd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};
const fmtDate=s=>{const d=parseYmd(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
const fmtLong=s=>{const d=parseYmd(s);return DSEM_L[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()].toLowerCase()};
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const parseMoney=s=>{s=String(s||"").trim().replace(/[R$\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isNaN(n)?0:Math.round(n*100)/100};
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
const byId=(col,id)=>S[col].find(x=>x.id===id);
const patName=a=>{const p=a.pacienteId&&byId("pacientes",a.pacienteId);return p?p.nome:(a.pacienteNome||"Sem paciente")};
const evaColor=n=>{const c=["#3E9B6A","#5AA460","#7DAA55","#A0AE4C","#C0AA45","#D59A41","#DE863F","#DD7140","#D85E48","#CE4C55","#C03B5E"];return c[Math.max(0,Math.min(10,n|0))]};
const sortAppt=(a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------- data layer (guardado no próprio aparelho) ---------- */
const KEY="alanna-fisio-v1";
S.meta={};
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function snapshot(){const o={app:"alanna-fisio",v:1};COLS.forEach(c=>o[c]=S[c]);o.config=S.config;return o}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(Object.assign(snapshot(),{meta:S.meta})));return true}
  catch(e){toast("Não foi possível salvar no aparelho. Faça um backup agora.");return false}
}
function applyData(d){COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c].filter(x=>x&&x.id):[]);S.config=d.config&&typeof d.config==="object"?d.config:{}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);applyData(d);S.meta=d.meta||{}}}catch(e){}
  S.mode="local";
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
async function save(col,obj){
  const rec=Object.assign({},obj);const id=rec.id||newId();rec.id=id;rec.atualizadoEm=new Date().toISOString();
  const arr=S[col];const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=rec;else arr.push(rec);
  persist();render();return id;
}
async function remove(col,id){S[col]=S[col].filter(x=>x.id!==id);persist();render()}
function renderBanner(){}
const isLoading=()=>false;
const hasData=()=>S.pacientes.length||S.agenda.length||S.financeiro.length;
function daysSinceBackup(){const t=S.meta.ultimoBackup;if(!t)return null;return Math.floor((Date.now()-new Date(t).getTime())/864e5)}
async function doBackup(){
  const name="backup-consultorio-"+todayStr()+".json";
  const data=JSON.stringify(Object.assign(snapshot(),{exportadoEm:new Date().toISOString()}));
  const mark=()=>{S.meta.ultimoBackup=new Date().toISOString();persist();render();toast("Backup criado. Guarde o arquivo em local seguro.")};
  let file=null;try{file=new File([data],name,{type:"application/json"})}catch(e){}
  if(file&&navigator.canShare&&navigator.share){
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Backup do consultório"});mark();return}}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  try{const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);mark()}
  catch(e){toast("Não foi possível gerar o backup neste aparelho.")}
}
function pickRestore(){const inp=document.getElementById("restore-file");inp.value="";inp.click()}
function onRestoreFile(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{
    let d=null;try{d=JSON.parse(r.result)}catch(e){}
    if(!d||typeof d!=="object"||!Array.isArray(d.pacientes)){toast("Esse arquivo não é um backup do consultório.");return}
    const n=c=>Array.isArray(d[c])?d[c].length:0;
    const html=`<p class="sub" style="margin:0 0 14px">O arquivo <b>${esc(f.name)}</b> tem ${n("pacientes")} pacientes, ${n("agenda")} atendimentos, ${n("evolucoes")} evoluções, ${n("pacotes")} pacotes e ${n("financeiro")} lançamentos.</p>
    ${hasData()?`<div class="banner" style="margin:0 0 14px"><b>Atenção:</b> os dados atuais deste aparelho (${S.pacientes.length} pacientes, ${S.agenda.length} atendimentos) serão substituídos pelos do arquivo.</div>`:""}
    <div class="btns"><button class="btn" id="do-restore">Restaurar estes dados</button><button class="btn ghost" id="cancel-restore">Cancelar</button></div>`;
    openSheet("Restaurar backup",html,root=>{
      root.querySelector("#do-restore").addEventListener("click",()=>{applyData(d);if(persist()){closeSheet();render();toast("Dados restaurados")}});
      root.querySelector("#cancel-restore").addEventListener("click",closeSheet);
    });
  };
  r.onerror=()=>toast("Não foi possível ler o arquivo.");
  r.readAsText(f);
}

/* ---------- derived ---------- */
function packUsage(p){
  const realizados=S.agenda.filter(a=>a.pacoteId===p.id&&a.status==="realizado").length;
  const used=(Number(p.usadasAntes)||0)+realizados;const total=Number(p.total)||0;
  return {used,total,left:Math.max(0,total-used)};
}
function activePack(pid){return S.pacotes.filter(p=>p.pacienteId===pid&&p.ativo!==false&&packUsage(p).left>0).sort((a,b)=>String(a.inicio).localeCompare(String(b.inicio)))[0]}
function monthKey(s){return String(s).slice(0,7)}
function monthStats(mk){
  const f=S.financeiro.filter(x=>monthKey(x.data)===mk);
  const rec=f.filter(x=>x.tipo==="entrada"&&x.status!=="pendente").reduce((t,x)=>t+(+x.valor||0),0);
  const pend=f.filter(x=>x.tipo==="entrada"&&x.status==="pendente").reduce((t,x)=>t+(+x.valor||0),0);
  const out=f.filter(x=>x.tipo==="saida").reduce((t,x)=>t+(+x.valor||0),0);
  return {rec,pend,out,saldo:rec-out,items:f};
}
function saldoAte(mk){ // saldo acumulado até o fim do mês mk
  const base=Number(S.config.saldoInicial)||0;
  return base+S.financeiro.filter(x=>monthKey(x.data)<=mk&&x.status!=="pendente").reduce((t,x)=>t+(x.tipo==="saida"?-1:1)*(+x.valor||0),0);
}
const semBaixa=()=>S.agenda.filter(a=>a.data<todayStr()&&(a.status==="agendado"||a.status==="confirmado"||!a.status)).sort(sortAppt);

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===UI.tab?"page":"false"));
  const v=$("#view");
  const fn={hoje:vHoje,agenda:vAgenda,pacientes:vPacientes,pacotes:vPacotes,financeiro:vFinanceiro}[UI.tab]||vHoje;
  v.innerHTML=fn();
  if(openPatient)refreshPatientSheet();
}
function apptRow(a,showDate){
  const p=a.pacoteId&&byId("pacotes",a.pacoteId);const st=a.status||"agendado";
  const bits=[];if(showDate)bits.push(fmtDate(a.data));if(a.tipo==="domicilio")bits.push("Domicílio");
  if(p){const u=packUsage(p);bits.push("Pacote "+u.used+"/"+u.total)}
  if(a.obs)bits.push(a.obs);
  return `<button class="appt s-${st}" data-act="appt" data-id="${esc(a.id)}"><span class="time">${esc(a.hora||"--:--")}</span><span class="who"><b>${esc(patName(a))}</b><span>${esc(bits.join(" · ")||"Consultório")}</span></span><span class="pill ${st}">${STATUS[st]}</span></button>`;
}
function loadingBlock(){return '<div class="empty"><b>Carregando seus dados…</b>Agenda, pacientes e financeiro aparecem aqui em instantes.</div>'}

function vHoje(){
  const t=todayStr();const h=new Date().getHours();
  const greet=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  let out=`<h1>${greet}, Alanna</h1><p class="sub">${esc(fmtLong(t).replace(/^./,c=>c.toUpperCase()))}</p>`;
  if(!hasData()&&!S.meta.comecou)return out+`<div class="welcome"><h2 style="margin-top:0">Primeiro acesso</h2><p>Os dados do consultório ficam guardados só neste aparelho. Se você recebeu o arquivo com os dados iniciais ou um backup, restaure agora. Se preferir, comece com o app vazio.</p><div class="btns"><button class="btn" data-act="restore">Restaurar backup</button><button class="btn ghost" data-act="start-empty">Começar do zero</button></div></div>`+footer();
  const hoje=S.agenda.filter(a=>a.data===t).sort(sortAppt);
  out+=`<h2>Atendimentos de hoje <button class="link" data-act="go-agenda">Ver agenda</button></h2>`;
  if(hoje.length)out+=`<div class="list">${hoje.map(a=>apptRow(a)).join("")}</div>`;
  else{
    const next=S.agenda.filter(a=>a.data>t).sort(sortAppt);
    const nd=next[0]&&next[0].data;
    out+=`<div class="empty"><b>Nenhum atendimento hoje</b>${nd?"Próximo dia com agenda: "+esc(fmtLong(nd)):"Toque em + para agendar."}</div>`;
    if(nd)out+=`<h2>${esc(fmtLong(nd).replace(/^./,c=>c.toUpperCase()))}</h2><div class="list">${next.filter(a=>a.data===nd).map(a=>apptRow(a)).join("")}</div>`;
  }
  // KPIs
  const mk=monthKey(t);const ms=monthStats(mk);
  const ws=weekStart(t),we=addDays(ws,6);
  const semana=S.agenda.filter(a=>a.data>=ws&&a.data<=we);
  const mes=S.agenda.filter(a=>monthKey(a.data)===mk);
  const real=mes.filter(a=>a.status==="realizado").length,falt=mes.filter(a=>a.status==="faltou").length;
  const taxa=real+falt?Math.round(falt/(real+falt)*100):0;
  const ativos=new Set(S.agenda.filter(a=>a.data>=addDays(t,-45)&&a.pacienteId).map(a=>a.pacienteId)).size;
  out+=`<h2>Indicadores de ${MESES[+mk.slice(5)-1].toLowerCase()}</h2><div class="kpis">
    <div class="kpi hero"><div class="k-label">Recebido no mês</div><div class="k-val">${brl(ms.rec)}</div><div class="k-note">${ms.pend?brl(ms.pend)+" a receber":"Sem pendências"} · saldo do mês ${brl(ms.saldo)}</div></div>
    <div class="kpi"><div class="k-label">Atendimentos na semana</div><div class="k-val">${semana.length}</div><div class="k-note">${semana.filter(a=>a.status==="realizado").length} realizados</div></div>
    <div class="kpi"><div class="k-label">Sessões no mês</div><div class="k-val">${real}</div><div class="k-note">realizadas</div></div>
    <div class="kpi"><div class="k-label">Faltas no mês</div><div class="k-val">${falt}</div><div class="k-note">${taxa}% das sessões</div></div>
    <div class="kpi"><div class="k-label">Pacientes ativos</div><div class="k-val">${ativos}</div><div class="k-note">atendidos em 45 dias</div></div>
  </div>`;
  // Alerts
  const sb=semBaixa();
  const fim=S.pacotes.filter(p=>p.ativo!==false).map(p=>({p,u:packUsage(p)})).filter(x=>x.u.total&&x.u.left<=2);
  const pendList=S.financeiro.filter(x=>x.tipo==="entrada"&&x.status==="pendente");
  const dsb=daysSinceBackup();const needBk=hasData()&&(dsb===null||dsb>=7);
  if(sb.length||fim.length||pendList.length||needBk){
    out+="<h2>Precisa de atenção</h2>";
    if(needBk)out+=`<button class="alert" data-act="backup"><span class="dot" style="background:var(--rose)"></span><span class="a-body"><b>Faça um backup</b><span>${dsb===null?"Nenhum backup feito neste aparelho":"Último backup há "+dsb+" dias"}</span></span><span class="chev">›</span></button>`;
    if(sb.length)out+=`<button class="alert" data-act="sem-baixa"><span class="dot"></span><span class="a-body"><b>${sb.length} atendimento${sb.length>1?"s":""} sem baixa</b><span>Marque como realizado ou faltou</span></span><span class="chev">›</span></button>`;
    fim.forEach(x=>{const pn=(byId("pacientes",x.p.pacienteId)||{}).nome||"Paciente";out+=`<button class="alert" data-act="pack" data-id="${esc(x.p.id)}"><span class="dot" style="background:var(--rose)"></span><span class="a-body"><b>${esc(pn)}: ${x.u.left===0?"pacote concluído":x.u.left===1?"resta 1 sessão":"restam "+x.u.left+" sessões"}</b><span>Pacote de ${x.u.total} sessões</span></span><span class="chev">›</span></button>`});
    if(pendList.length)out+=`<button class="alert" data-act="go-fin"><span class="dot" style="background:var(--conf)"></span><span class="a-body"><b>${pendList.length} recebimento${pendList.length>1?"s":""} pendente${pendList.length>1?"s":""}</b><span>${brl(pendList.reduce((t,x)=>t+(+x.valor||0),0))} no total</span></span><span class="chev">›</span></button>`;
  }
  out+=`<h2>Entradas por mês</h2>`+chartMonths(t);
  out+=footer();
  return out;
}
function chartMonths(t){
  const y=t.slice(0,4);const m=+t.slice(5,7);const data=[];
  for(let i=1;i<=m;i++){const mk=y+"-"+pad(i);data.push({l:MESES[i-1].slice(0,3),v:monthStats(mk).rec,cur:i===m})}
  const max=Math.max(1,...data.map(d=>d.v));const W=340,H=150,top=18,bot=22,bw=W/data.length;
  const nice=Math.ceil(max/1000)*1000;
  let g="";[0,.5,1].forEach(f=>{const yy=top+(H-top-bot)*(1-f);g+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`});
  const bars=data.map((d,i)=>{const h=(H-top-bot)*d.v/nice;const x=i*bw+bw*.18;const yy=H-bot-h;
    return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="4" fill="${d.cur?"var(--rose)":"var(--rose-soft)"}" opacity="${d.cur?1:.45}"/>`+
    (d.cur?`<text x="${(x+bw*.32).toFixed(1)}" y="${(yy-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${Math.round(d.v/100)/10}k</text>`:"")+
    `<text x="${(i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.l}</text>`}).join("");
  return `<div class="chart"><div class="c-cap"><span>Recebimentos em ${y}</span><span>Linha superior: ${brl(nice).replace(",00","")}</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas por mês em ${y}">${g}${bars}</svg></div>`;
}
function footer(){return `<div class="footer">Alanna Viana · Fisioterapeuta · CREFITO 181150-F<br>Vita Clin, Sala 06 · Praça José Marcelino, 144 · Centro, Ilhéus</div>`}

function vAgenda(){
  const d=UI.agDate||todayStr();
  let out=`<h1>Agenda</h1><div class="toolbar"><div class="seg" role="group" aria-label="Visualização"><button data-act="agmode" data-v="dia" aria-pressed="${UI.agMode==="dia"}">Dia</button><button data-act="agmode" data-v="semana" aria-pressed="${UI.agMode==="semana"}">Semana</button></div>
  <div class="datenav"><button class="round" data-act="agnav" data-v="-1" aria-label="Anterior">‹</button><button class="small-btn" data-act="agnav" data-v="0">Hoje</button><button class="round" data-act="agnav" data-v="1" aria-label="Próximo">›</button></div></div>`;
  if(isLoading())return out+'<div style="margin-top:16px">'+loadingBlock()+"</div>";
  const t=todayStr();
  if(UI.agMode==="dia"){
    const items=S.agenda.filter(a=>a.data===d).sort(sortAppt);
    out+=`<div class="daygroup ${d===t?"today":""}"><div class="dh"><b>${esc(fmtLong(d).replace(/^./,c=>c.toUpperCase()))}</b><span>${items.length} atendimento${items.length===1?"":"s"}</span></div>`;
    out+=items.length?`<div class="list">${items.map(a=>apptRow(a)).join("")}</div>`:`<div class="empty"><b>Dia livre</b>Toque em + para agendar um atendimento.</div>`;
    out+="</div>";
  }else{
    const ws=weekStart(d);
    out+=`<p class="sub" style="margin-top:12px">Semana de ${fmtDate(ws)} a ${fmtDate(addDays(ws,6))}</p>`;
    for(let i=0;i<7;i++){
      const day=addDays(ws,i);const items=S.agenda.filter(a=>a.data===day).sort(sortAppt);
      const wd=parseYmd(day).getDay();const atende=[1,3,5].includes(wd);
      if(!items.length&&!atende)continue;
      out+=`<div class="daygroup ${day===t?"today":""}"><div class="dh"><b>${DSEM[wd]} ${fmtDate(day)}</b><span>${items.length?items.length+" atendimento"+(items.length>1?"s":""):"livre"}</span></div>`;
      if(items.length)out+=`<div class="list">${items.map(a=>apptRow(a)).join("")}</div>`;
      out+="</div>";
    }
  }
  return out;
}

function vPacientes(){
  let out=`<h1>Pacientes</h1><input class="search" id="q" type="search" placeholder="Buscar por nome, convênio ou diagnóstico" value="${esc(UI.q)}" autocomplete="off">`;
  if(isLoading())return out+'<div style="margin-top:16px">'+loadingBlock()+"</div>";
  const q=UI.q.trim().toLowerCase();
  const list=S.pacientes.filter(p=>!q||[p.nome,p.convenio,p.diagnostico].join(" ").toLowerCase().includes(q)).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),"pt-BR"));
  out+=`<h2>${list.length} paciente${list.length===1?"":"s"}</h2>`;
  if(!list.length)return out+`<div class="empty"><b>${q?"Nenhum paciente encontrado":"Nenhum paciente cadastrado"}</b>Toque em + para cadastrar.</div>`;
  const t=todayStr();
  out+=`<div class="list">`+list.map(p=>{
    const nx=S.agenda.filter(a=>a.pacienteId===p.id&&a.data>=t).sort(sortAppt)[0];
    const meta=[p.convenio||"Convênio não informado",p.diagnostico||null,nx?"Próx.: "+fmtDate(nx.data)+" "+nx.hora:null].filter(Boolean).join(" · ");
    return `<button class="prow" data-act="patient" data-id="${esc(p.id)}"><span class="avatar">${esc(initials(p.nome))}</span><span class="p-body"><b>${esc(p.nome)}</b><span>${esc(meta)}</span></span><span class="chev">›</span></button>`}).join("")+`</div>`;
  return out;
}

function spine(u){let s="";for(let i=0;i<u.total;i++)s+=`<i class="${i<u.used?"used":""}"></i>`;return `<div class="spine" aria-label="${u.used} de ${u.total} sessões usadas">${s}</div>`}
function packCard(p){
  const u=packUsage(p);const pn=(byId("pacientes",p.pacienteId)||{}).nome||"Paciente";
  const done=u.left===0||p.ativo===false;
  return `<button class="pack ${done?"done":""}" data-act="pack" data-id="${esc(p.id)}"><div class="ph"><b>${esc(pn)}</b><span class="count">${u.left} <small>restante${u.left===1?"":"s"}</small></span></div>${spine(u)}<div class="meta"><span>${u.used} de ${u.total} usadas</span>${p.valor?`<span>${brl(p.valor)}</span>`:""}${p.inicio?`<span>Início ${fmtDate(p.inicio)}</span>`:""}${done?"<span>Concluído</span>":""}</div></button>`;
}
function vPacotes(){
  let out=`<h1>Pacotes de sessões</h1><p class="sub">Cada sessão marcada como realizada na agenda desconta do pacote do paciente.</p>`;
  if(isLoading())return out+'<div style="margin-top:16px">'+loadingBlock()+"</div>";
  const act=S.pacotes.filter(p=>p.ativo!==false&&packUsage(p).left>0),old=S.pacotes.filter(p=>!act.includes(p));
  out+=`<h2>Ativos</h2>`+(act.length?`<div class="list">${act.map(packCard).join("")}</div>`:`<div class="empty"><b>Nenhum pacote ativo</b>Toque em + para criar um pacote. Se o paciente já usou algumas sessões, informe em “Sessões já usadas”.</div>`);
  if(old.length)out+=`<h2>Concluídos</h2><div class="list">${old.map(packCard).join("")}</div>`;
  return out;
}

function vFinanceiro(){
  const mk=UI.finMonth||monthKey(todayStr());const [y,m]=mk.split("-").map(Number);
  let out=`<h1>Financeiro</h1><div class="toolbar"><div class="datenav"><button class="round" data-act="finnav" data-v="-1" aria-label="Mês anterior">‹</button><span class="lbl" style="min-width:130px">${MESES[m-1]} ${y}</span><button class="round" data-act="finnav" data-v="1" aria-label="Próximo mês">›</button></div></div>`;
  if(isLoading())return out+'<div style="margin-top:16px">'+loadingBlock()+"</div>";
  const ms=monthStats(mk);
  out+=`<div class="kpis"><div class="kpi hero"><div class="k-label">Saldo do mês</div><div class="k-val">${brl(ms.saldo)}</div><div class="k-note">Saldo acumulado ${brl(saldoAte(mk))}</div></div>
  <div class="kpi"><div class="k-label">Recebido</div><div class="k-val" style="color:var(--ok)">${brl(ms.rec)}</div></div>
  <div class="kpi"><div class="k-label">Saídas</div><div class="k-val">${brl(ms.out)}</div></div>
  <div class="kpi" style="grid-column:1/-1"><div class="k-label">Pendências (a receber)</div><div class="k-val" style="color:var(--miss)">${brl(ms.pend)}</div></div></div>`;
  const pend=ms.items.filter(x=>x.tipo==="entrada"&&x.status==="pendente").sort((a,b)=>a.data.localeCompare(b.data));
  const rest=ms.items.filter(x=>!pend.includes(x)).sort((a,b)=>b.data.localeCompare(a.data)||String(b.atualizadoEm||"").localeCompare(String(a.atualizadoEm||"")));
  const row=x=>`<button class="lrow ${x.status==="pendente"?"pend":""}" data-act="fin" data-id="${esc(x.id)}"><b>${esc(x.descricao||"Lançamento")}</b><span class="amt ${x.tipo==="saida"?"out":"in"}">${x.tipo==="saida"?"− ":"+ "}${brl(x.valor)}</span><span class="lmeta">${fmtDate(x.data)} · ${esc(x.forma||"")}${x.status==="pendente"?" · pendente":""}${x.obs?" · "+esc(x.obs):""}</span></button>`;
  if(pend.length)out+=`<h2>Pendências</h2><div class="ledger">${pend.map(row).join("")}</div>`;
  out+=`<h2>Lançamentos <span style="text-transform:none;letter-spacing:0;font-weight:600">${rest.length}</span></h2>`;
  out+=rest.length?`<div class="ledger">${rest.map(row).join("")}</div>`:`<div class="empty"><b>Nenhum lançamento neste mês</b>Toque em + para registrar um recebimento ou uma saída.</div>`;
  return out;
}

/* ---------- sheets ---------- */
let openPatient=null;
function openSheet(title,html,mount){
  $("#sheet-title").textContent=title;$("#sheet-body").innerHTML=html;$("#sheet-body").scrollTop=0;
  const sc=$("#scrim"),sh=$("#sheet");sc.hidden=false;sh.hidden=false;
  requestAnimationFrame(()=>{sc.classList.add("open");sh.classList.add("open")});
  if(mount)mount($("#sheet-body"));
}
function closeSheet(){
  openPatient=null;const sc=$("#scrim"),sh=$("#sheet");sc.classList.remove("open");sh.classList.remove("open");
  setTimeout(()=>{if(!sh.classList.contains("open")){sc.hidden=true;sh.hidden=true}},260);
}
function patientOptions(sel){return `<option value="">Selecione…</option>`+S.pacientes.slice().sort((a,b)=>String(a.nome).localeCompare(String(b.nome),"pt-BR")).map(p=>`<option value="${esc(p.id)}" ${p.id===sel?"selected":""}>${esc(p.nome)}</option>`).join("")}
function armDelete(btn,fn){btn.addEventListener("click",async()=>{if(btn.dataset.armed){btn.disabled=true;try{await fn();closeSheet();toast("Excluído")}catch(e){btn.disabled=false}}else{btn.dataset.armed="1";btn.textContent="Toque de novo para excluir"}})}
function val(root,id){const el=root.querySelector("#"+id);return el?el.value.trim():""}

/* Appointment detail */

function sheetApptForm(a){

  <div class="row2"><div class="field"><label for="f-data">Data</label><input id="f-data" type="date" value="${esc(a.data)}" required></div><div class="field"><label for="f-hora">Horário</label><input id="f-hora" type="time" value="${esc(a.hora)}" required></div></div>
  <div class="row2"><div class="field"><label for="f-tipo">Local</label><select id="f-tipo"><option value="consultorio">Consultório</option><option value="domicilio" ${a.tipo==="domicilio"?"selected":""}>Domicílio</option></select></div>
  <div class="field"><label for="f-st">Status</label><select id="f-st">${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===(a.status||"agendado")?"selected":""}>${STATUS[k]}</option>`).join("")}</select></div></div>

      const def=init?a.pacoteId:(activePack(pid)||{}).id;
      pk.innerHTML=`<option value="">Sessão avulsa</option>`+opts.map(p=>{const u=packUsage(p);return `<option value="${esc(p.id)}" ${p.id===def?"selected":""}>Pacote ${u.total} sessões · restam ${u.left}</option>`}).join("")};
    fillPk(!!a.id);sel.addEventListener("change",()=>fillPk(false));

    });

/* Patient */
function patientHtml(p){
  const evs=S.evolucoes.filter(e=>e.pacienteId===p.id).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  const packs=S.pacotes.filter(x=>x.pacienteId===p.id);
  const t=todayStr();const prox=S.agenda.filter(a=>a.pacienteId===p.id&&a.data>=t).sort(sortAppt).slice(0,3);
  const hist=S.agenda.filter(a=>a.pacienteId===p.id&&a.data<t);
  const faltas=hist.filter(a=>a.status==="faltou").length,realiz=hist.filter(a=>a.status==="realizado").length;
  const tel=String(p.telefone||"").replace(/\D/g,"");const wa=tel?("https://wa.me/"+(tel.length<=11?"55":"")+tel):"";
  let h=`<div class="info">
    <div class="ir"><span>Telefone</span><b class="num">${esc(p.telefone||"Não informado")}</b></div>
    <div class="ir"><span>Convênio</span><b>${esc(p.convenio||"Não informado")}</b></div>
    <div class="ir"><span>Diagnóstico de encaminhamento</span><b>${esc(p.diagnostico||"Não informado")}</b></div>
    ${p.medico?`<div class="ir"><span>Encaminhado por</span><b>${esc(p.medico)}</b></div>`:""}
    ${p.nascimento?`<div class="ir"><span>Nascimento</span><b>${esc(fmtDate(p.nascimento))}/${esc(String(p.nascimento).slice(0,4))}</b></div>`:""}
    ${p.obs?`<div class="ir"><span>Observações</span><b>${esc(p.obs)}</b></div>`:""}
    <div class="ir"><span>Histórico</span><b>${realiz} realizada${realiz===1?"":"s"} · ${faltas} falta${faltas===1?"":"s"}</b></div>
  </div>
  <div class="actions">${wa?`<a href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`:""}${tel?`<button data-p="copy">Copiar telefone</button>`:""}<button data-p="edit">Editar cadastro</button></div>`;
  h+=`<h2>Próximos atendimentos <button class="link" data-p="agendar">Agendar</button></h2>`+(prox.length?`<div class="list">${prox.map(a=>apptRow(a,true)).join("")}</div>`:`<div class="empty">Nenhum atendimento futuro.</div>`);
  h+=`<h2>Pacotes <button class="link" data-p="pacote">Novo pacote</button></h2>`+(packs.length?`<div class="list">${packs.map(packCard).join("")}</div>`:`<div class="empty">Sem pacote. Sessões avulsas.</div>`);
  const dores=evs.filter(e=>e.dor!==""&&e.dor!=null).slice().reverse();
  h+=`<h2>Evolução <button class="link" data-p="evo">Nova evolução</button></h2>`;
  if(dores.length>=2){
    const W=320,H=70;const pts=dores.map((e,i)=>[(i/(dores.length-1))*(W-20)+10,H-10-(+e.dor/10)*(H-24)]);
    h+=`<div class="chart" style="margin-bottom:8px"><div class="c-cap"><span>Escala de dor (EVA 0–10)</span><span>${dores[0].dor} → ${dores[dores.length-1].dor}</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução da dor"><line x1="0" x2="${W}" y1="${H-10}" y2="${H-10}" stroke="var(--line)"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--rose)" stroke-width="2.2" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${evaColor(dores[i].dor)}"/>`).join("")}</svg></div>`;
  }
  h+=evs.length?`<div class="list">${evs.map(e=>`<button class="evo" style="text-align:left;width:100%" data-evo="${esc(e.id)}"><div class="eh"><b>${fmtDate(e.data)}/${String(e.data).slice(2,4)}</b>${e.dor!==""&&e.dor!=null?`<span class="eva">EVA <i style="background:${evaColor(e.dor)}">${esc(e.dor)}</i></span>`:""}</div>${e.queixa?`<p><em>Queixa</em>${esc(e.queixa)}</p>`:""}${(e.condutas&&e.condutas.length)||e.condutasTexto?`<p><em>Condutas</em>${esc([...(e.condutas||[]),e.condutasTexto].filter(Boolean).join(", "))}</p>`:""}${e.obs?`<p><em>Observações</em>${esc(e.obs)}</p>`:""}</button>`).join("")}</div>`:`<div class="empty">Nenhuma evolução registrada.</div>`;
  return h;
}
function bindPatient(root,p){
  root.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",async()=>{
    const k=b.dataset.p;
    if(k==="copy"){try{await navigator.clipboard.writeText(p.telefone);toast("Telefone copiado")}catch(e){toast(p.telefone)}}
    if(k==="edit")sheetPatientForm(p);
    if(k==="agendar")sheetApptForm({pacienteId:p.id,data:todayStr(),hora:"",status:"agendado",tipo:"consultorio",pacoteId:(activePack(p.id)||{}).id||""});
    if(k==="pacote")sheetPack({pacienteId:p.id});
    if(k==="evo")sheetEvo({pacienteId:p.id,data:todayStr()});
  }));
  root.querySelectorAll("[data-evo]").forEach(b=>b.addEventListener("click",()=>sheetEvo(byId("evolucoes",b.dataset.evo))));
}
function sheetPatient(id){
  const p=byId("pacientes",id);if(!p)return;
  openSheet(p.nome,patientHtml(p),root=>bindPatient(root,p));openPatient=id;
}
function refreshPatientSheet(){
  const p=byId("pacientes",openPatient);if(!p)return;const root=$("#sheet-body");const st=root.scrollTop;
  root.innerHTML=patientHtml(p);bindPatient(root,p);root.scrollTop=st;$("#sheet-title").textContent=p.nome;
}

  <div class="field"><label for="p-obs">Observações</label><textarea id="p-obs">${esc(p.obs||"")}</textarea></div>

  openSheet(p.id?"Editar cadastro":"Novo paciente",html,root=>{

      const rec=Object.assign({},p,{nome:val(root,"p-nome"),telefone:val(root,"p-tel"),nascimento:val(root,"p-nasc"),convenio:val(root,"p-conv"),diagnostico:val(root,"p-diag"),medico:val(root,"p-med"),obs:val(root,"p-obs")});

/* Evolution */
function sheetEvo(e,fromAppt){
  e=e||{data:todayStr()};const sel=new Set(e.condutas||[]);let dor=(e.dor===0||e.dor)?+e.dor:null;
  const html=`<form id="f">
  <div class="row2"><div class="field"><label for="e-pac">Paciente</label><select id="e-pac" required>${patientOptions(e.pacienteId)}</select></div><div class="field"><label for="e-data">Data da sessão</label><input id="e-data" type="date" value="${esc(e.data)}"></div></div>
  <div class="field"><label for="e-q">Queixa do dia</label><textarea id="e-q" placeholder="Como chegou hoje, onde dói, o que mudou">${esc(e.queixa||"")}</textarea></div>
  <div class="field"><span class="lab">Escala de dor (EVA)</span><div class="evascale" id="eva">${Array.from({length:11},(_,i)=>`<button type="button" data-v="${i}" style="background:${evaColor(i)}" aria-pressed="${dor===i}" aria-label="Dor ${i}">${i}</button>`).join("")}</div><div class="evalegend"><span>Sem dor</span><span>Moderada</span><span>Pior dor</span></div></div>
  <div class="field"><span class="lab">Condutas</span><div class="chips" id="chips">${RECURSOS.map(r=>`<button type="button" class="chip" data-r="${esc(r)}" aria-pressed="${sel.has(r)}">${esc(r)}</button>`).join("")}</div></div>

  <div class="field"><label for="e-obs">Observações</label><textarea id="e-obs" placeholder="Resposta ao tratamento, orientações, plano para a próxima sessão">${esc(e.obs||"")}</textarea></div>
  <div class="btns"><button class="btn" type="submit">${e.id?"Salvar evolução":"Salvar evolução"+(fromAppt&&fromAppt.status!=="realizado"?" e marcar realizado":"")}</button>${e.id?'<button class="btn danger" type="button" id="del">Excluir evolução</button>':""}</div></form>`;
  openSheet(e.id?"Evolução da sessão":"Nova evolução",html,root=>{
    root.querySelectorAll("#eva button").forEach(b=>b.addEventListener("click",()=>{const v=+b.dataset.v;dor=dor===v?null:v;root.querySelectorAll("#eva button").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.v===dor))}));
    root.querySelectorAll("#chips .chip").forEach(b=>b.addEventListener("click",()=>{const r=b.dataset.r;sel.has(r)?sel.delete(r):sel.add(r);b.setAttribute("aria-pressed",sel.has(r))}));
    root.querySelector("#f").addEventListener("submit",async ev=>{ev.preventDefault();
      const rec=Object.assign({},e,{pacienteId:val(root,"e-pac"),data:val(root,"e-data"),queixa:val(root,"e-q"),dor:dor==null?"":dor,condutas:[...sel],condutasTexto:val(root,"e-ct"),obs:val(root,"e-obs")});

      try{await save("evolucoes",rec);

/* Package */
function sheetPack(p){

  <form id="f">

  const html=`<form id="f">

  <div class="field"><label for="x-desc">Descrição</label><input id="x-desc" value="${esc(x.descricao||"")}" placeholder="Paciente ou despesa" list="descs"><datalist id="descs">${S.pacientes.map(p=>`<option value="${esc(p.nome)}">`).join("")}</datalist></div>
  <div class="row2"><div class="field"><label for="x-valor">Valor</label><input id="x-valor" inputmode="decimal" value="${x.valor?esc(String(x.valor).replace(".",",")):""}" placeholder="0,00" required></div><div class="field"><label for="x-data">Data</label><input id="x-data" type="date" value="${esc(x.data)}"></div></div>
  <div class="row2"><div class="field"><label for="x-forma">Forma</label><select id="x-forma">${FORMAS.map(f=>`<option ${f===x.forma?"selected":""}>${f}</option>`).join("")}</select></div>
  <div class="field" id="stwrap"><label for="x-st">Situação</label><select id="x-st"><option value="recebido">Recebido</option><option value="pendente" ${x.status==="pendente"?"selected":""}>Pendente</option></select></div></div>
  <div class="field"><label for="x-pac">Paciente (opcional)</label><select id="x-pac">${patientOptions(x.pacienteId)}</select></div>
  <div class="field"><label for="x-obs">Observação</label><input id="x-obs" value="${esc(x.obs||"")}"></div>
  <div class="btns"><button class="btn" type="submit">${x.id?"Salvar lançamento":"Lançar"}</button>
  ${x.id&&x.status==="pendente"?'<button class="btn ghost" type="button" id="recv">Marcar como recebido hoje</button>':""}
  ${x.id?'<button class="btn danger" type="button" id="del">Excluir lançamento</button>':""}</div></form>`;
  openSheet(x.id?"Lançamento":"Novo lançamento",html,root=>{
    let tipo=x.tipo||"entrada";const stw=root.querySelector("#stwrap");stw.hidden=tipo==="saida";
    root.querySelectorAll("#tipo button").forEach(b=>b.addEventListener("click",()=>{tipo=b.dataset.v;root.querySelectorAll("#tipo button").forEach(z=>z.setAttribute("aria-pressed",z===b));stw.hidden=tipo==="saida"}));
    root.querySelector("#f").addEventListener("submit",async ev=>{ev.preventDefault();
      const rec=Object.assign({},x,{tipo,descricao:val(root,"x-desc"),valor:parseMoney(val(root,"x-valor")),data:val(root,"x-data"),forma:val(root,"x-forma"),status:tipo==="saida"?"recebido":val(root,"x-st"),pacienteId:val(root,"x-pac"),obs:val(root,"x-obs")});
      if(!rec.valor){toast("Informe o valor");return}
      try{await save("financeiro",rec);closeSheet();toast("Lançamento salvo")}catch(e){}
    });
    const r=root.querySelector("#recv");if(r)r.addEventListener("click",async()=>{try{await save("financeiro",Object.assign({},x,{status:"recebido",data:todayStr()}));closeSheet();toast("Recebimento confirmado")}catch(e){}});
    const d=root.querySelector("#del");if(d)armDelete(d,()=>remove("financeiro",x.id));
  });
}

function sheetSemBaixa(){
  const list=semBaixa();
  const html=`<p class="sub" style="margin:0 0 12px">Atendimentos que já passaram e ainda estão como agendado ou confirmado.</p><div class="list">${list.map(a=>apptRow(a,true)).join("")||'<div class="empty">Tudo em dia.</div>'}</div>`;
  openSheet("Sem baixa",html,root=>root.querySelectorAll("[data-act=appt]").forEach(b=>b.addEventListener("click",()=>sheetAppt(byId("agenda",b.dataset.id)))));
}
function sheetInfo(){
  const html=`<div style="display:grid;place-items:center;padding:8px 0 16px;color:var(--rose)"><svg width="96" height="84" aria-hidden="true"><use href="#av" fill="currentColor"/></svg></div>
  <div class="info"><div class="ir"><span>Fisioterapeuta</span><b>Alanna Viana</b></div><div class="ir"><span>CREFITO</span><b>181150-F</b></div><div class="ir"><span>Contato</span><b class="num">(73) 98128-5042</b></div><div class="ir"><span>Endereço</span><b>Praça José Marcelino, 144 · Vita Clin, Sala 06 · Centro · Ilhéus/BA</b></div><div class="ir"><span>Atendimento</span><b>Segunda, quarta (manhã) e sexta (tarde)</b></div><div class="ir"><span>Instagram</span><b>@alannavfisio</b></div></div>
  <div class="actions"><a href="https://instagram.com/alannavfisio" target="_blank" rel="noopener">Abrir Instagram</a></div>
  <h2>Dados e backup</h2><p class="sub" style="margin-bottom:12px">Os dados ficam guardados só neste aparelho. Faça um backup toda semana e guarde o arquivo no iCloud Drive, no e-mail ou no WhatsApp.</p>
  <div class="info" style="margin-bottom:10px"><div class="ir"><span>Último backup</span><b>${S.meta.ultimoBackup?esc(fmtDate(ymd(new Date(S.meta.ultimoBackup))))+"/"+new Date(S.meta.ultimoBackup).getFullYear():"Nenhum ainda"}</b></div><div class="ir"><span>Registros</span><b>${S.pacientes.length} pacientes · ${S.agenda.length} atendimentos · ${S.financeiro.length} lançamentos</b></div></div>
  <div class="btns"><button class="btn" id="bk">Fazer backup</button><button class="btn ghost" id="rs">Restaurar backup</button></div>
  <h2>Usar como aplicativo</h2><p class="sub">No Safari do iPhone, toque em Compartilhar e depois em “Adicionar à Tela de Início”. Use sempre pelo ícone: os dados do ícone e os do Safari ficam separados.</p>`;
  openSheet("Consultório",html,root=>{root.querySelector("#bk").addEventListener("click",doBackup);root.querySelector("#rs").addEventListener("click",pickRestore)});
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const k=b.dataset.act,id=b.dataset.id;
  if(k==="appt"){const a=byId("agenda",id);if(a)sheetAppt(a)}
  else if(k==="patient")sheetPatient(id);
  else if(k==="pack"){const p=byId("pacotes",id);if(p)sheetPack(p)}
  else if(k==="fin"){const x=byId("financeiro",id);if(x)sheetFin(x)}
  else if(k==="go-agenda")location.hash="agenda";
  else if(k==="go-fin")location.hash="financeiro";
  else if(k==="sem-baixa")sheetSemBaixa();
  else if(k==="backup")doBackup();
  else if(k==="restore")pickRestore();
  else if(k==="start-empty"){S.meta.comecou=true;persist();render()}
  else if(k==="agmode"){UI.agMode=b.dataset.v;render()}
  else if(k==="agnav"){const n=+b.dataset.v;const step=UI.agMode==="dia"?1:7;UI.agDate=n===0?todayStr():addDays(UI.agDate||todayStr(),n*step);render()}
  else if(k==="finnav"){const mk=UI.finMonth||monthKey(todayStr());const d=parseYmd(mk+"-01");d.setMonth(d.getMonth()+(+b.dataset.v));UI.finMonth=monthKey(ymd(d));render()}
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){UI.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}});
$("#fab").addEventListener("click",()=>{({hoje:()=>sheetApptForm(),agenda:()=>sheetApptForm(),pacientes:()=>sheetPatientForm(),pacotes:()=>sheetPack(),financeiro:()=>sheetFin()})[UI.tab]()});
$("#btn-info").addEventListener("click",sheetInfo);
$("#restore-file").addEventListener("change",e=>onRestoreFile(e.target.files&&e.target.files[0]));
$("#sheet-close").addEventListener("click",closeSheet);
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
window.addEventListener("scroll",()=>$("#top").classList.toggle("scrolled",window.scrollY>4),{passive:true});
function route(){const h=(location.hash||"").replace("#","");UI.tab=["hoje","agenda","pacientes","pacotes","financeiro"].includes(h)?h:"hoje";closeSheet();render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
load();route();
})();
</script>
